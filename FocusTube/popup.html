<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>FocusTube</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet"
  />

  <link
    href="https://fonts.googleapis.com/icon?family=Material+Icons"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="app">

    <!-- HEADER -->
    <header>
      <span class="material-icons logo">play_circle</span>
      <div>
        <h1>FocusTube</h1>
        <p>Distraction-free YouTube</p>
      </div>
    </header>

    <!-- MAIN CARD -->
    <div class="card">

      <!-- Focus Toggle -->
      <div class="section">
        <div class="row">
          <span class="label">Focus Mode</span>
          <label class="switch">
            <input type="checkbox" id="toggle">
            <span class="slider"></span>
          </label>
        </div>
        <p id="status" class="status">OFF</p>
      </div>

      <div class="divider"></div>

      <!-- Mode -->
      <div class="section">
        <div class="row">
          <span class="label">Mode</span>
          <select id="modeSelect">
            <option value="normal">Normal</option>
            <option value="advanced">Advanced</option>
          </select>
        </div>
      </div>

      <!-- Advanced Controls -->
      <div id="advancedOptions" class="advanced">
        <div class="advanced-title">Advanced Controls</div>

        <label class="check">
          <input type="checkbox" id="hideHome">
          Hide Home
        </label>

        <label class="check">
          <input type="checkbox" id="hideShorts">
          Hide Shorts
        </label>

        <label class="check">
          <input type="checkbox" id="hideComments">
          Hide Comments
        </label>

        <label class="check">
          <input type="checkbox" id="hideRelated">
          Hide Related
        </label>
      </div>

    </div>

    <!-- FOOTER -->
    <div class="footer-divider"></div>

    <footer>
      <div class="dev">
        Developed by
        <a href="https://www.youtube.com/@PoorvithsLife_Official/" target="_blank">
          Poorvith T A
        </a>
      </div>

      <a class="github-link" href="https://github.com/PoorvithTA" target="_blank">
        <span class="material-icons github-icon">code</span>
        <span>GitHub</span>
      </a>

      <p class="shortcut">Ctrl + Shift + F → Quick Toggle</p>
    </footer>

  </div>

  <script src="popup.js"></script>
</body>
</html>
