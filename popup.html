<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>FocusTube</title>

  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="app">

    <!-- HEADER -->
    <header>
      <span class="material-icons-round logo-icon">play_circle_filled</span>
      <div>
        <h1>FocusTube</h1>
        <p>Distraction-free YouTube</p>
      </div>
    </header>

    <!-- FOCUS TOGGLE -->
    <div class="card toggle-card">
      <div class="row-between">
        <div class="row-gap">
          <span class="material-icons-round row-icon">center_focus_strong</span>
          <span class="label">Focus Mode</span>
        </div>
        <label class="switch">
          <input type="checkbox" id="toggle">
          <span class="slider"></span>
        </label>
      </div>
      <p class="status-text" id="status">Disabled</p>
    </div>

    <!-- MODE -->
    <div class="card">
      <p class="section-title">Mode</p>
      <div class="segmented">
        <button class="seg-btn active" id="btnNormal" data-val="normal">Normal</button>
        <button class="seg-btn" id="btnAdvanced" data-val="advanced">Advanced</button>
      </div>
      <p class="mode-hint" id="modeHint">Hides feed, Shorts, comments &amp; related.</p>
    </div>

    <!-- FILTERS -->
    <div class="card" id="filtersCard">
      <p class="section-title">Filters</p>
      <div class="filters-grid">

        <button class="filter-btn" id="btn-hideHome" data-key="hideHome">
          <div class="icon-wrap">
            <i class="bi bi-house-fill filter-icon"></i>
            <span class="slash"></span>
          </div>
          <span class="filter-label">Home</span>
        </button>

        <button class="filter-btn" id="btn-hideShorts" data-key="hideShorts">
          <div class="icon-wrap">
            <i class="bi bi-phone-fill filter-icon"></i>
            <span class="slash"></span>
          </div>
          <span class="filter-label">Shorts</span>
        </button>

        <button class="filter-btn" id="btn-hideComments" data-key="hideComments">
          <div class="icon-wrap">
            <i class="bi bi-chat-fill filter-icon"></i>
            <span class="slash"></span>
          </div>
          <span class="filter-label">Comments</span>
        </button>

        <button class="filter-btn" id="btn-hideRelated" data-key="hideRelated">
          <div class="icon-wrap">
            <i class="bi bi-collection-play-fill filter-icon"></i>
            <span class="slash"></span>
          </div>
          <span class="filter-label">Related</span>
        </button>

      </div>
      <p class="filter-hint" id="filterHint">Switch to Advanced to customize.</p>
    </div>

    <!-- FOOTER -->
    <footer>
      <span>by <a href="https://www.youtube.com/@PoorvithsLife_Official/" target="_blank">Poorvith T A</a></span>
      <a href="https://github.com/PoorvithTA" target="_blank">
        <i class="bi bi-github"></i> GitHub
      </a>
    </footer>

  </div>

  <script src="popup.js"></script>
</body>
</html>
